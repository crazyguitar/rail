apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bench
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.node }}
      nodeName: {{ . }}
      {{- end }}
      tolerations:
        - operator: Exists
      containers:
        - name: bench
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: {{ .Values.kernel }}
            # The default profile blocks io_uring, which the bulk path uses:
            # transfers hang rather than fail. A privileged container gets this
            # anyway; an unprivileged run does not.
            seccompProfile:
              type: Unconfined
          env:
            - name: RAIL_PEER
              value: {{ required "peer is required: the host that serves" .Values.peer | quote }}
            # The container's own filesystem is an overlay, which has no block
            # device behind it: the local disk column cannot widen a readahead
            # it cannot find. This points that column at the node's disk.
            - name: RAIL_LOCAL
              value: /tmp/rail-bench
            - name: RAIL_FABRIC
              value: {{ .Values.fabric | default .Values.peer | quote }}
            - name: RAIL_BINARY
              value: "/opt/rail/build/tools/rail/rail"
            - name: RAIL_KO
              value: /host-modules/railfs.ko
            - name: HOME
              value: /root
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              # The private key arrives read-only from the secret, and ssh
              # refuses one the group can read.
              install -m 700 -d /root/.ssh
              cp /secret-ssh/* /root/.ssh/ 2>/dev/null || true
              chmod 600 /root/.ssh/* 2>/dev/null || true
              printf 'Host *\n  User %s\n  StrictHostKeyChecking accept-new\n' \
                {{ required "ssh.user is required: the account on the peer" .Values.ssh.user }} > /root/.ssh/config
              {{- if .Values.kernel }}
              ln -sf "/lib/modules/$(uname -r)/extra/railfs.ko" /host-modules/railfs.ko
              {{- end }}
              exec {{ with .Values.cpus }}taskset -c {{ . }} {{ end }}/opt/rail/build/bench/rail-bench \
                --benchmark_filter='{{ .Values.filter }}' \
                --benchmark_repetitions=5 \
                --benchmark_report_aggregates_only=true
          volumeMounts:
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: host-modules
              mountPath: /host-modules
            - name: dev
              mountPath: /dev
            - name: workdir
              mountPath: /tmp/rail-bench
            {{- if .Values.kernel }}
            - name: debugfs
              mountPath: /sys/kernel/debug
            {{- end }}
            - name: ssh
              mountPath: /secret-ssh
              readOnly: true
      volumes:
        - name: modules
          hostPath:
            path: {{ .Values.module }}
            type: Directory
        - name: host-modules
          emptyDir: {}
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: workdir
          hostPath:
            path: /tmp/rail-bench
            type: DirectoryOrCreate
        {{- if .Values.kernel }}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        {{- end }}
        - name: ssh
          secret:
            secretName: {{ .Values.ssh.secret }}
            defaultMode: 0600
