name: 🚀 Feature request
description: Suggest an idea for rail
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: Motivation
      description: What problem would this solve? What are you moving, and over what?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed change
      description: >
        What you'd like to see: a flag, a mount option, a protocol change,
        example commands.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Workarounds or other tools you've considered.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
