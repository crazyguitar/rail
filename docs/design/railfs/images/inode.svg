      <rect x="226" y="156" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="254" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ(2)</text>

      <rect x="448" y="212" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOLIO NOT UPTODATE</text>

      <rect x="460" y="268" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="277" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">-&gt;READAHEAD(RAC)</text>

      <rect x="708" y="324" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="778" y="333" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PATH FROM I_PRIVATE</text>
      <rect x="708" y="340" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="778" y="349" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">I_INO IS ONLY A LABEL</text>

      <rect x="708" y="380" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="764" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CUT INTO FETCHES</text>
      <rect x="708" y="396" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="764" y="405" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUEUE_WORK X N</text>

      <rect x="690" y="436" width="132" height="12" rx="2" fill="#f5f5f5"/>
      <text x="756" y="445" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ · PATH, OFF, LEN</text>

      <rect x="696" y="476" width="124" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="485" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LEN · FILE SIZE · OK</text>

      <rect x="688" y="516" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="758" y="525" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">THE PAGE, OVER A RAIL</text>

      <rect x="708" y="572" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="764" y="581" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CHECK THE DIGEST</text>
      <rect x="708" y="588" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="772" y="597" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEMCPY_TO_FOLIO</text>

      <rect x="462" y="628" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="512" y="637" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FOLIOS UPTODATE</text>

      <rect x="214" y="668" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="256" y="677" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COPY_TO_USER</text>

      <rect x="210" y="764" width="88" height="12" rx="2" fill="#f1f1f1"/>
      <text x="254" y="773" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ(2) AGAIN</text>

      <rect x="210" y="804" width="92" height="12" rx="2" fill="#f1f1f1"/>
      <text x="256" y="813" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NO WIRE AT ALL</text>

      <!-- ACTORS -->
      <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
