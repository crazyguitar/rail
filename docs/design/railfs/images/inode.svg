<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 896" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inode-title inode-desc">
      <title id="inode-title">A read of a remote file</title>
      <desc id="inode-desc">Sequence diagram of a cold read: the page cache misses, railfs takes the path out of the inode's i_private - the inode number is never used to find anything - and cuts the readahead window into page-sized fetches and queues them on its workqueue, each one asking raild over the control socket and receiving the payload over an RDMA rail, which is checked against its digest and copied into the folios.; a second read of the same range is served from the page cache with no wire traffic.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

