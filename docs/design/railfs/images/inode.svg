      <rect x="304" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="72" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
